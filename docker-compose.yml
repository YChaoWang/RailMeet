services:
  postgres:
    # postgis/postgis is amd64-only; baosystems publishes linux/arm64 for Apple Silicon.
    image: ghcr.io/baosystems/postgis:16-3.5
    container_name: railmeet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: railmeet
      POSTGRES_PASSWORD: railmeet
      POSTGRES_DB: railmeet
    ports:
      - '5432:5432'
    volumes:
      - railmeet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U railmeet -d railmeet']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Alpine multi-arch image (arm64 + amd64). Local durability via AOF + named volume.
    # Production Redis provisioning (HA, auth, memory limits) is out of scope for Compose.
    image: redis:7-alpine
    container_name: railmeet-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    ports:
      - '6379:6379'
    volumes:
      - railmeet_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  railmeet_postgres_data:
  railmeet_redis_data:
